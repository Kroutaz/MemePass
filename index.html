<html>
<head>
  <title>Meme Generator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      height: 100vh;
    }

    .left {
      width: 50%;
      padding: 20px;
      text-align: center;
      border-right: 2px solid #333;
    }

    img {
      width: 90%;
      max-width: 450px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .buttons {
      margin-top: 15px;
    }

    button {
      font-size: 22px;
      margin: 10px;
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    .yes {
      background: #2ecc71;
      color: white;
    }

    .no {
      background: #e74c3c;
      color: white;
    }

    .right {
      width: 50%;
      padding: 20px;
      overflow-y: scroll;
    }

    .item {
      margin-bottom: 20px;
      padding: 10px;
      background: #222;
      border-radius: 10px;
    }

    .item img {
      width: 100%;
      border-radius: 10px;
    }

    .title {
      font-size: 14px;
      margin-top: 5px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="left">
    <h1>Meme Generator</h1>

    <img id="currentImg">

    <div class="buttons">
      <button class="no" onclick="nextMeme()">❌</button>
      <button class="yes" onclick="saveMeme()">✔️</button>
    </div>
  </div>

  <div class="right">
    <h2>Saved Memes</h2>
    <div id="history"></div>
  </div>

  <script>
    let current = null;
    async function loadMeme() {
      const res = await fetch("https://meme-api.com/gimme");
      const data = await res.json();
      current = data;

      document.getElementById("currentImg").src = data.url;
    }

    function nextMeme() {
      loadMeme();
    }

    function saveMeme() {
      if (!current) return;
      const history = document.getElementById("history");
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <img src="${current.url}">
        <div class="title">${current.title}</div>
      `;

      history.prepend(div);
      loadMeme();
    }

    loadMeme();
  </script>

</body>
</html>
